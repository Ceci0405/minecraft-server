services:
  minecraft:
    image: itzg/minecraft-server:java21          # ← versión de Java fijada
    container_name: mc
    ports:
      - "127.0.0.1:25565:25565"                  # ← solo accesible desde tu PC
    environment:
      EULA: "TRUE"
      TYPE: "NEOFORGE"
      VERSION: "1.21.1"
      MEMORY: "6G"
      TZ: "Europe/Madrid"
      MOTD: "Servidor de la comunidad"
      DIFFICULTY: "normal"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      WHITELIST: ${WHITELIST}
      OPS: ${OPS}
      RCON_PASSWORD: ${RCON_PASSWORD}
      MODRINTH_PROJECTS: |
        jei
        sophisticated-backpacks
        xaeros-minimap
        xaeros-world-map
        open-parties-and-claims:neoforge-1.21.1-0.32.7
        yungs-better-dungeons
        chococraft
        patchouli
        ferrite-core
        modernfix
        jade
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
    volumes:
      - ./data:/data
    restart: unless-stopped
    stdin_open: true
    tty: true